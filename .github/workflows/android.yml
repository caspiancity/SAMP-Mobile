name: Build SA-MP Mobile APK

on:
  push:
    branches: [ "GTA-2.11", "main" ]
  pull_request:
    branches: [ "GTA-2.11" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Case-Insensitive Native ext4 Workspace
        run: |
          # 4 GB həcmində virtual diski yaradırıq
          dd if=/dev/zero of=/tmp/casefold.img bs=1M count=4096
          mkfs.ext4 -O casefold /tmp/casefold.img
          
          # Diski /tmp/mnt_casefold ünvanına bağlayırıq (ana qovluq)
          mkdir -p /tmp/mnt_casefold
          sudo mount -o loop /tmp/casefold.img /tmp/mnt_casefold
          sudo chown -R $USER:$USER /tmp/mnt_casefold
          
          # Ana qovluğun içində lost+found olduğu üçün boş DEYİL.
          # Buna görə içəridə tamamilə boş olan yeni alt qovluq yaradırıq:
          mkdir -p /tmp/mnt_casefold/ci_workspace
          
          # Böyük-kiçik hərf həssaslığını (casefold) sadəcə bu boş alt qovluğa tətbiq edirik
          chattr +F /tmp/mnt_casefold/ci_workspace
          
          # Layihə fayllarını artıq təhlükəsiz şəkildə həmin qovluğa kopyalayırıq
          cp -r . /tmp/mnt_casefold/ci_workspace/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          # DİQQƏT: İş sahəsi artıq mnt_casefold/ci_workspace altındadır
          cd /tmp/mnt_casefold/ci_workspace
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Mobile-Debug
          path: /tmp/mnt_casefold/ci_workspace/app/build/outputs/apk/debug/*.apk
