name: Build SA-MP Mobile APK

on:
  push:
    branches: [ "GTA-2.11", "main" ]
  pull_request:
    branches: [ "GTA-2.11" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Case-Insensitive Native ext4 Workspace
        run: |
          # 4 GB həcmində virtual diski yaradılır
          dd if=/dev/zero of=/tmp/casefold.img bs=1M count=4096
          mkfs.ext4 -O casefold /tmp/casefold.img
          
          mkdir -p /tmp/ci_workspace
          sudo mount -o loop /tmp/casefold.img /tmp/ci_workspace
          sudo chown -R $USER:$USER /tmp/ci_workspace
          
          # Boş qovluğa böyük-kiçik hərf həssaslığını ləğv edən attribut verilir
          chattr +F /tmp/ci_workspace
          
          # Layihə faylları kopyalanır
          cp -r . /tmp/ci_workspace/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          cd /tmp/ci_workspace
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Mobile-Debug
          path: /tmp/ci_workspace/app/build/outputs/apk/debug/*.apk
