name: Build SAMP-Mobile

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      addrs:
        description: "Crash ünvanları (məs: 0x16c81c 0x16c818). Boş qalsa crash.log oxunur"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (NDK, CMake, licenses)
        shell: bash
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true

          NDK=$(grep -rhoE "ndkVersion\s*=?\s*['\"][0-9.]+['\"]" --include=*.gradle --include=*.kts . | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" || true)
          CMK=$(grep -rhoE "version\s*=?\s*['\"][0-9]+\.[0-9]+\.[0-9]+['\"]" --include=*.gradle --include=*.kts . | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" || true)

          PKGS="platform-tools"
          [ -n "$NDK" ] && PKGS="$PKGS ndk;$NDK" || PKGS="$PKGS ndk;26.1.10909125"
          [ -n "$CMK" ] && PKGS="$PKGS cmake;$CMK" || PKGS="$PKGS cmake;3.22.1"
          echo "Installing: $PKGS"
          "$SDKM" $PKGS || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix case-sensitivity (Windows-style paths)
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          from collections import defaultdict

          ROOT = os.getcwd()
          SKIP = {'.git', 'build', '.gradle', '.cxx', 'node_modules'}

          files = []
          for d, dn, fn in os.walk(ROOT):
              dn[:] = [x for x in dn if x not in SKIP]
              for f in fn:
                  rel = os.path.relpath(os.path.join(d, f), ROOT)
                  files.append(rel.replace(os.sep, '/'))

          by_name = defaultdict(list)
          for p in files:
              by_name[p.rsplit('/', 1)[-1].lower()].append(p)

          def resolve(ref):
              clean = ref.replace('\\', '/')
              prefix = ''
              while True:
                  if clean.startswith('./'):
                      prefix += './'; clean = clean[2:]
                  elif clean.startswith('../'):
                      prefix += '../'; clean = clean[3:]
                  elif clean.startswith('/'):
                      prefix += '/'; clean = clean[1:]
                  else:
                      break
              if not clean:
                  return None
              parts = clean.split('/')
              lc = clean.lower()
              matches = [c for c in by_name.get(parts[-1].lower(), [])
                         if c.lower() == lc or c.lower().endswith('/' + lc)]
              if not matches:
                  return None
              if any(m == clean or m.endswith('/' + clean) for m in matches):
                  return prefix + clean if '\\' in ref else None
              fixed = {'/'.join(m.split('/')[-len(parts):]) for m in matches}
              if len(fixed) != 1:
                  return None
              return prefix + fixed.pop()

          INC = re.compile(r'(#\s*include\s*)(["<])([^">\n]+)([">])')
          BLD = re.compile(r'[A-Za-z0-9_\-./]+\.(?:c|cc|cpp|cxx|h|hpp|inc|S|s)(?![A-Za-z0-9_])')
          SRC_EXT = {'.c', '.cc', '.cpp', '.cxx', '.h', '.hpp', '.inc', '.mm'}

          def fix_inc(m):
              ref = m.group(3)
              if m.group(2) == '<' and '/' not in ref:
                  return m.group(0)
              new = resolve(ref)
              return m.group(1) + m.group(2) + new + m.group(4) if new else m.group(0)

          def fix_bld(m):
              new = resolve(m.group(0))
              return new if new else m.group(0)

          changed = 0
          for p in files:
              name = os.path.basename(p)
              ext = os.path.splitext(name)[1].lower()
              if ext in SRC_EXT:
                  rx, fn = INC, fix_inc
              elif name == 'CMakeLists.txt' or ext in {'.cmake', '.mk', '.gradle', '.kts'}:
                  rx, fn = BLD, fix_bld
              else:
                  continue
              path = os.path.join(ROOT, p)
              try:
                  with open(path, 'r', encoding='utf-8', errors='surrogateescape', newline='') as f:
                      old = f.read()
              except Exception:
                  continue
              new = rx.sub(fn, old)
              if new != old:
                  with open(path, 'w', encoding='utf-8', errors='surrogateescape', newline='') as f:
                      f.write(new)
                  changed += 1
                  print('fixed:', p)
          print('Total files fixed:', changed)
          PY

      - name: Add JitPack repo (init script)
        shell: bash
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/jitpack.gradle <<'EOF'
          gradle.settingsEvaluated { settings ->
            try {
              settings.dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
              }
            } catch (Throwable ignored) {}
          }
          gradle.allprojects {
            repositories {
              google()
              mavenCentral()
              maven { url 'https://jitpack.io' }
            }
          }
          EOF

      - name: Fix PRDownloader version
        run: sed -i 's/PRDownloader:1\.0\.1/PRDownloader:1.0.2/g' app/build.gradle

      - name: Restore keystore from repo
        id: ks
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/../keys"
          if [ -f keystore/new.jks ]; then
            cp keystore/new.jks "$GITHUB_WORKSPACE/../keys/new.jks"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Using saved keystore"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No saved keystore, will create one"
          fi

      - name: Create keystore (first time only)
        if: steps.ks.outputs.exists != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import re, os, subprocess

          g_file = 'app/build.gradle'
          if not os.path.exists(g_file) and os.path.exists('app/build.gradle.kts'):
              g_file = 'app/build.gradle.kts'

          sp, ka, kp = '123456', 'key0', '123456'

          if os.path.exists(g_file):
              with open(g_file, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()

              m_sp = re.search(r'storePassword\s*=?\s*[\'"]([^\'"]+)[\'"]', content)
              m_ka = re.search(r'keyAlias\s*=?\s*[\'"]([^\'"]+)[\'"]', content)
              m_kp = re.search(r'keyPassword\s*=?\s*[\'"]([^\'"]+)[\'"]', content)

              if m_sp: sp = m_sp.group(1)
              if m_ka: ka = m_ka.group(1)
              if m_kp: kp = m_kp.group(1)
              elif m_sp: kp = sp

          print(f"Using keystore alias={ka}")

          keys_dir = os.path.abspath(os.path.join(os.environ['GITHUB_WORKSPACE'], '..', 'keys'))
          os.makedirs(keys_dir, exist_ok=True)
          ks_path = os.path.join(keys_dir, 'new.jks')

          cmd = [
              'keytool', '-genkeypair',
              '-keystore', ks_path,
              '-alias', ka,
              '-keyalg', 'RSA',
              '-keysize', '2048',
              '-validity', '10000',
              '-storepass', sp,
              '-keypass', kp,
              '-dname', 'CN=SAMP, OU=Dev, O=Dev, L=Baku, S=Baku, C=AZ'
          ]
          subprocess.run(cmd, check=True)
          PY

      - name: Save keystore to repo (first time only)
        if: steps.ks.outputs.exists != 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p keystore
          cp "$GITHUB_WORKSPACE/../keys/new.jks" keystore/new.jks
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add keystore/new.jks
          git commit -m "Add persistent signing keystore [skip ci]"
          git push || echo "::warning::Could not push keystore (check Workflow permissions)"

      - name: Rename package everywhere (the.apaches)
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil

          ROOT = os.getcwd()
          SKIP = {'.git', 'build', '.gradle', '.cxx', 'node_modules', 'keystore'}
          TEXT_EXT = {'.java', '.kt', '.kts', '.xml', '.gradle', '.properties',
                      '.cpp', '.cc', '.c', '.h', '.hpp', '.inc', '.cmake',
                      '.txt', '.json', '.mk', '.pro'}
          PAIRS = [
              ('com/samp/mobile', 'the/apaches'),
              ('com.samp.mobile', 'the.apaches'),
              ('com_samp_mobile', 'the_apaches'),
          ]

          # 1. Bütün mətn fayllarında əvəz et (C++ JNI daxil)
          changed = 0
          for d, dn, fn in os.walk(ROOT):
              dn[:] = [x for x in dn if x not in SKIP]
              for f in fn:
                  if os.path.splitext(f)[1].lower() not in TEXT_EXT and f != 'CMakeLists.txt':
                      continue
                  p = os.path.join(d, f)
                  try:
                      with open(p, 'r', encoding='utf-8', errors='surrogateescape', newline='') as fh:
                          s = fh.read()
                  except Exception:
                      continue
                  n = s
                  for a, b in PAIRS:
                      n = n.replace(a, b)
                  if n != s:
                      with open(p, 'w', encoding='utf-8', errors='surrogateescape', newline='') as fh:
                          fh.write(n)
                      changed += 1
                      print('updated:', os.path.relpath(p, ROOT))
          print('Yenilənmiş fayllar:', changed)

          # 2. Qovluqları köçür: .../com/samp/mobile -> .../the/apaches
          dirs = []
          for d, dn, fn in os.walk(os.path.join(ROOT, 'app', 'src')):
              if os.path.normpath(d).replace(os.sep, '/').endswith('/com/samp/mobile'):
                  dirs.append(d)
          for d in dirs:
              src_root = os.path.dirname(os.path.dirname(os.path.dirname(d)))
              dst = os.path.join(src_root, 'the', 'apaches')
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              shutil.copytree(d, dst, dirs_exist_ok=True)
              shutil.rmtree(d)
              print('moved:', os.path.relpath(d, ROOT), '->', os.path.relpath(dst, ROOT))
              for parent in [os.path.dirname(d), os.path.dirname(os.path.dirname(d))]:
                  try:
                      os.rmdir(parent)
                  except OSError:
                      pass

          # 3. Qalan köhnə adları yoxla
          left = []
          for d, dn, fn in os.walk(ROOT):
              dn[:] = [x for x in dn if x not in SKIP]
              for f in fn:
                  if os.path.splitext(f)[1].lower() in TEXT_EXT:
                      try:
                          s = open(os.path.join(d, f), encoding='utf-8', errors='ignore').read()
                      except Exception:
                          continue
                      if 'com.samp.mobile' in s or 'com/samp/mobile' in s or 'com_samp_mobile' in s:
                          left.append(os.path.relpath(os.path.join(d, f), ROOT))
          print('Qalan köhnə ad olan fayllar:', left or 'yoxdur')
          PY

      - name: Update Package Name and Version
        shell: bash
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re, json

          run_num = int(os.environ.get('RUN_NUMBER', 1))
          version_code = 300 + run_num
          version_name = f"0.3.{run_num}"

          print(f"Paket adı yenilənir: the.apaches | Version Name: {version_name} | Version Code: {version_code}")

          # 1. Gradle fayllarını yenilə
          gradle_files = ['app/build.gradle', 'app/build.gradle.kts']
          for g_file in gradle_files:
              if os.path.exists(g_file):
                  with open(g_file, 'r', encoding='utf-8') as f:
                      content = f.read()

                  content = re.sub(r'applicationId\s*=?\s*[\'"][^\'"]+[\'"]', 'applicationId "the.apaches"', content)
                  content = re.sub(r'namespace\s*=?\s*[\'"][^\'"]+[\'"]', 'namespace "the.apaches"', content)
                  content = re.sub(r'versionCode\s*=?\s*\d+', f'versionCode {version_code}', content)
                  content = re.sub(r'versionName\s*=?\s*[\'"][^\'"]+[\'"]', f'versionName "{version_name}"', content)

                  with open(g_file, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f"Uğurla yeniləndi: {g_file}")

          # 2. AndroidManifest.xml: package atributunu sil
          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r', encoding='utf-8', errors='ignore') as f:
                  m_content = f.read()
              m_content = re.sub(r'\s*package\s*=\s*[\'"][^\'"]+[\'"]', '', m_content)
              m_content = m_content.replace('com.samp.mobile', 'the.apaches')
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(m_content)
              print("AndroidManifest.xml təmizləndi və yeniləndi.")

          # 3. google-services.json
          gs_path = 'app/google-services.json'
          if os.path.exists(gs_path):
              try:
                  with open(gs_path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
                  for client in data.get('client', []):
                      client_info = client.get('client_info', {})
                      android_client_info = client_info.get('android_client_info', {})
                      if 'package_name' in android_client_info:
                          android_client_info['package_name'] = 'the.apaches'
                  with open(gs_path, 'w', encoding='utf-8') as f:
                      json.dump(data, f, indent=4)
                  print("google-services.json paket adı uğurla yeniləndi.")
              except Exception as e:
                  print(f"google-services.json yenilənərkən xəta: {e}")

          # 4. Java/Kotlin/XML fayllarında qalan köhnə ad
          src_dir = 'app/src/main'
          changed_files = 0
          if os.path.exists(src_dir):
              for root, dirs, files in os.walk(src_dir):
                  for file in files:
                      if file.endswith(('.java', '.kt', '.xml', '.properties')):
                          f_path = os.path.join(root, file)
                          try:
                              with open(f_path, 'r', encoding='utf-8', errors='ignore') as f:
                                  text = f.read()
                              if 'com.samp.mobile' in text:
                                  new_text = text.replace('com.samp.mobile', 'the.apaches')
                                  with open(f_path, 'w', encoding='utf-8') as f:
                                      f.write(new_text)
                                  changed_files += 1
                          except Exception:
                              pass
          print(f"Cəmi {changed_files} mənbə faylında paket adı 'the.apaches' olaraq yeniləndi.")
          PY

      # ---------------------------------------------------------------
      # Native simvollar: bu iki addım olmadan crash ünvanını oxumaq olmur
      # ---------------------------------------------------------------
      - name: Enable native debug symbols (native-debug-symbols.zip)
        shell: bash
        run: |
          if ! grep -q "debugSymbolLevel" app/build.gradle; then
            sed -i '/defaultConfig *{/a\        ndk { debugSymbolLevel "FULL" }' app/build.gradle
          fi
          grep -n "debugSymbolLevel" app/build.gradle || echo "DEBUG ayarı tapılmadı"

      - name: Remove native strip flags (CMake / Gradle)
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re

          ROOT = os.getcwd()
          SKIP = {'.git', 'build', '.gradle', '.cxx', 'node_modules', 'keystore'}

          TOKENS = [
              r'-Wl,--strip-all', r'-Wl,--strip-debug',
              r'-Wl,-s(?![\w-])', r'-Wl,-S(?![\w-])',
              r'--strip-all', r'--strip-debug', r'-g0(?![\w-])',
          ]
          LONE_S = re.compile(r"""(?<=[\s"'(])-s(?=[\s"')])""")
          FLAG_LINE = re.compile(r'FLAGS|link_options|compile_options|cppFlags|cFlags|arguments|target_link|LINKER', re.I)
          WATCH = re.compile(r'strip|-g0|CMAKE_BUILD_TYPE|-Wl,', re.I)

          def cfiles():
              for d, dn, fn in os.walk(ROOT):
                  dn[:] = [x for x in dn if x not in SKIP]
                  for f in fn:
                      if f == 'CMakeLists.txt' or f.endswith(('.cmake', '.gradle', '.kts')):
                          yield os.path.join(d, f)

          target = None
          shown = 0
          for p in cfiles():
              rel = os.path.relpath(p, ROOT)
              try:
                  with open(p, 'r', encoding='utf-8', errors='surrogateescape', newline='') as fh:
                      src = fh.read()
              except Exception:
                  continue

              if os.path.basename(p) == 'CMakeLists.txt' and re.search(r'add_library\s*\(\s*(?:samp\b|\$\{PROJECT_NAME\})', src, re.I):
                  target = p

              out_lines = []
              changed = False
              for i, line in enumerate(src.split('\n'), 1):
                  new = line
                  if not line.lstrip().startswith(('#', '//')):
                      for t in TOKENS:
                          new = re.sub(t, '', new)
                      if FLAG_LINE.search(new):
                          new = LONE_S.sub('', new)
                  if new != line:
                      changed = True
                      print(f'[silindi] {rel}:{i}: {line.strip()[:150]}')
                  elif shown < 60 and WATCH.search(line):
                      shown += 1
                      print(f'[izle]    {rel}:{i}: {line.strip()[:150]}')
                  out_lines.append(new)
              if changed:
                  with open(p, 'w', encoding='utf-8', errors='surrogateescape', newline='') as fh:
                      fh.write('\n'.join(out_lines))

          if target:
              with open(target, 'a', encoding='utf-8', errors='surrogateescape', newline='') as fh:
                  fh.write('\n\n# --- CI: native debug symbols ---\n'
                           'set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS} -g")\n'
                           'set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS} -g")\n')
              print('[eklendi] -g bayrağı:', os.path.relpath(target, ROOT))
          else:
              print('[xəbərdarlıq] add_library(samp ...) olan CMakeLists tapılmadı')
          PY

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Symbolize crash (libsamp.so)
        if: always()
        shell: bash
        env:
          INPUT_ADDRS: ${{ github.event.inputs.addrs }}
        run: |
          set +e
          set +o pipefail
          mkdir -p /tmp/out
          REPORT=/tmp/out/report.txt
          : > "$REPORT"
          say() { echo "$*" | tee -a "$REPORT"; }
          finish() {
            { echo '### libsamp.so crash simvolları'; echo '```'; cat "$REPORT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          trap finish EXIT

          ZIP=$(find app/build/outputs -name "native-debug-symbols.zip" 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then say "native-debug-symbols.zip tapılmadı (build uğursuz ola bilər)"; exit 0; fi

          rm -rf /tmp/sym && mkdir -p /tmp/sym
          unzip -q "$ZIP" -d /tmp/sym

          # Zip-in içində fayl "libsamp.so.dbg" adlanır
          DBG=$(find /tmp/sym -path "*arm64-v8a*" -name "libsamp.so*" | head -1)
          STRIPPED=$(find app/build/intermediates/merged_native_libs -path "*arm64-v8a*" -name "libsamp.so" 2>/dev/null | head -1)
          if [ -z "$DBG" ]; then
            say "libsamp dbg faylı zip-də yoxdur. Zip məzmunu:"
            find /tmp/sym -type f | tee -a "$REPORT"
            exit 0
          fi
          say "DBG:     $DBG ($(stat -c %s "$DBG") bayt)"
          if [ -n "$STRIPPED" ]; then
            say "APK .so: $STRIPPED ($(stat -c %s "$STRIPPED") bayt)"
            say "sha256:  $(sha256sum "$STRIPPED" | cut -d' ' -f1)"
          fi

          BIN=$(find "$ANDROID_HOME/ndk" -type d -path "*/toolchains/llvm/prebuilt/linux-x86_64/bin" | sort -V | tail -1)
          A2L="$BIN/llvm-addr2line"; [ -x "$A2L" ] || A2L=""
          SYMZ="$BIN/llvm-symbolizer"
          RE="$BIN/llvm-readelf"; NM="$BIN/llvm-nm"; OD="$BIN/llvm-objdump"
          say "NDK bin: $BIN"

          say ""
          say "===== SİMVOL / DEBUG BÖLMƏLƏRİ ====="
          SECT=$("$RE" -S "$DBG" 2>&1)
          HAS_SYMTAB=$(echo "$SECT" | grep -c "\.symtab")
          HAS_DEBUG=$(echo "$SECT" | grep -c "\.debug_info")
          say "symtab: $HAS_SYMTAB | debug_info: $HAS_DEBUG   (0 = yoxdur)"

          # Ünvanları topla: input + crash.log (libsamp.so + 0x... və samp: 0x...)
          python3 - "$STRIPPED" > /tmp/out/addrs.txt <<'PY'
          import os, re, sys
          size = 0x1000000
          if len(sys.argv) > 1 and os.path.exists(sys.argv[1]):
              size = os.path.getsize(sys.argv[1])
          inp = os.environ.get('INPUT_ADDRS', '')
          log = ''
          if os.path.exists('crash.log'):
              log = open('crash.log', encoding='utf-8', errors='ignore').read()
          found = []
          for m in re.finditer(r'libsamp\.so \+ (0x[0-9a-fA-F]+)|samp: (0x[0-9a-fA-F]+)', inp + '\n' + log):
              found.append(m.group(1) or m.group(2))
          for m in re.finditer(r'0x[0-9a-fA-F]{3,8}\b', inp):
              found.append(m.group(0))
          out = []
          for a in found:
              v = int(a, 16)
              if 0 < v < size and v not in out:
                  out.append(v)
          if not out:
              out = [0x16c81c, 0x16c818, 0x16fb40, 0x175cf0, 0x16dfc0, 0x16e624, 0x134f9c]
              print('# crash.log yoxdur - ehtiyat ünvanlar işlədildi', file=sys.stderr)
          for v in out:
              print(hex(v))
          PY
          say ""
          say "Ünvanlar: $(tr '\n' ' ' < /tmp/out/addrs.txt)"

          say ""
          say "===== FAYL:SƏTİR (addr2line) ====="
          while read -r A; do
            [ -z "$A" ] && continue
            for X in "$A" "$(printf '0x%x' $((A - 4)))"; do
              say "--- $X"
              if [ -n "$A2L" ]; then
                "$A2L" -f -C -i -e "$DBG" "$X" < /dev/null 2>&1 | tee -a "$REPORT"
              else
                "$SYMZ" --obj="$DBG" "$X" < /dev/null 2>&1 | tee -a "$REPORT"
              fi
            done
          done < /tmp/out/addrs.txt

          "$NM" -n -C --defined-only "$DBG" > /tmp/out/symbols.txt 2>/dev/null
          say ""
          say "===== YAXIN SİMVOL (nm), simvol sayı: $(wc -l < /tmp/out/symbols.txt) ====="
          if [ "$HAS_SYMTAB" = "0" ]; then
            say "DİQQƏT: .symtab yoxdur. Aşağıdakılar yalnız export olunan simvollardır, ETİBARSIZDIR."
          fi
          python3 - <<'PY' 2>&1 | tee -a "$REPORT"
          import bisect
          syms = []
          for l in open('/tmp/out/symbols.txt', errors='ignore'):
              p = l.rstrip('\n').split(' ', 2)
              if len(p) == 3:
                  try:
                      syms.append((int(p[0], 16), p[2]))
                  except ValueError:
                      pass
          syms.sort()
          keys = [s[0] for s in syms]
          for l in open('/tmp/out/addrs.txt'):
              l = l.strip()
              if not l:
                  continue
              a = int(l, 16)
              i = bisect.bisect_right(keys, a) - 1
              if i >= 0:
                  print(f'{l} -> {syms[i][1]} +{hex(a - syms[i][0])}')
              else:
                  print(f'{l} -> ?')
          PY

          say ""
          say "===== DISASM (ilk 2 ünvanın ətrafı) ====="
          for A in $(head -2 /tmp/out/addrs.txt); do
            S=$(printf '0x%x' $((A - 0x30)))
            E=$(printf '0x%x' $((A + 0x20)))
            say "--- $A"
            "$OD" -d -C --no-show-raw-insn --start-address=$S --stop-address=$E "$DBG" < /dev/null 2>&1 | tee -a "$REPORT"
          done

      - name: Upload symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samp-native-symbols
          path: |
            /tmp/out/report.txt
            /tmp/out/symbols.txt
            /tmp/sym/arm64-v8a/libsamp.so.dbg
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samp-mobile-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: warn