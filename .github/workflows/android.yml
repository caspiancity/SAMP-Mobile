name: Build SA-MP Mobile APK

on:
  push:
    branches: [ "GTA-2.11", "main" ]
  pull_request:
    branches: [ "GTA-2.11" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Case-Insensitive Filesystem (ciopfs)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ciopfs
          mkdir -p /tmp/raw_data /tmp/ci_workspace
          ciopfs /tmp/raw_data /tmp/ci_workspace
          cp -r . /tmp/ci_workspace/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Build APK with Gradle
        run: |
          cd /tmp/ci_workspace
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-Mobile-Debug
          path: /tmp/ci_workspace/app/build/outputs/apk/debug/*.apk
