      - name: Symbolize crash
        run: |
          SO=$(find app/build/intermediates/cxx -path "*arm64-v8a*" -name libsamp.so | head -1)
          echo "$SO"
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-addr2line -f -C -e "$SO" 0x16c704 0x175bd8 0x16dea8 0x16e50c 0x134f0c