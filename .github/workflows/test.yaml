name: Check Lib Symbols

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and run nm on all libGTASA.so files
        run: |
          echo "=== Tapılan libGTASA.so faylları və simvollar ==="
          
          # Repoda nə qədər libGTASA.so varsa hamısını avtomatik tapır və yoxlayır
          find . -name "libGTASA.so" | while read -r file; do
            echo ""
            echo "----------------------------------------"
            echo "Fayl tapıldı: $file"
            echo "----------------------------------------"
            nm -D "$file" | grep -i -E "plate|CustomCar" || echo "Bu faylda uyğun simvol tapılmadı."
          done
